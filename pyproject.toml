[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ConfigGPT"
version = "0.1.0"
description = "Configuration pipeline (hubcore) for proxy/config ingestion, dedup, scoring, ranking and deterministic output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["hubcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
